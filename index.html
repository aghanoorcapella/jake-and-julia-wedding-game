<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jake &amp; Julia: The Road to Promise City</title>
<meta name="description" content="A wedding gift video game for Jake Elafros and Julia Buchholz. November 21, 2026, Promise City, Iowa.">
<style>
  html,body{margin:0;height:100%;background:#14202e;overflow:hidden;font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px 14px 18px;pointer-events:none}
  #touch.on{display:flex}
  .pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;pointer-events:auto}
  .b{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);border-radius:14px;color:#fff;font:bold 20px "Courier New",monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto}
  .b:active,.b.down{background:rgba(255,220,120,.6)}
  #a{width:84px;height:84px;border-radius:50%;font-size:22px}
  #mute{position:fixed;top:6px;right:8px;color:#fff;font:12px "Courier New",monospace;opacity:.7;cursor:pointer;background:rgba(0,0,0,.4);padding:3px 7px;border-radius:6px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="400"></canvas></div>
<div id="mute">♪ music: on (M)</div>
<div id="touch">
  <div class="pad">
    <span></span><div class="b" data-k="u">▲</div><span></span>
    <div class="b" data-k="l">◀</div><span></span><div class="b" data-k="r">▶</div>
    <span></span><div class="b" data-k="d">▼</div><span></span>
  </div>
  <div class="b" id="a" data-k="a">A</div>
</div>
<script>
'use strict';
/* =====================================================================
   JAKE & JULIA: THE ROAD TO PROMISE CITY
   A wedding gift. Story and details come from their wedding website.
   Edit GIFT_FROM to sign the gift.
   ===================================================================== */
const GIFT_FROM = "Your friends";
const WEDDING = new Date(2026, 10, 21);

const W = 640, H = 400;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fit() {
  const touchOn = document.getElementById('touch').classList.contains('on');
  const availH = innerHeight - (touchOn && innerHeight > innerWidth ? 170 : 0);
  const s = Math.min(innerWidth / W, availH / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.getElementById('touch').classList.add('on');
addEventListener('resize', fit); fit();

/* ---------- input ---------- */
const keys = {}, tk = {};
let actPressed = false;
const ACT = [' ', 'Enter', 'z', 'Z'];
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (!keys[e.key]) {
    if (ACT.includes(e.key)) actPressed = true;
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') navPress = -1;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') navPress = 1;
  }
  keys[e.key] = true; audioInit();
});
addEventListener('keyup', e => { keys[e.key] = false; });
let navPress = 0;
const inL = () => keys.ArrowLeft || keys.a || keys.A || tk.l;
const inR = () => keys.ArrowRight || keys.d || keys.D || tk.r;
const inU = () => keys.ArrowUp || keys.w || keys.W || tk.u;
const inD = () => keys.ArrowDown || keys.s || keys.S || tk.d;
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audioInit(); if (k === 'a') actPressed = true; else { tk[k] = true; if (k === 'u') navPress = -1; if (k === 'd') navPress = 1; } b.classList.add('down'); };
  const off = e => { e.preventDefault(); tk[k] = false; b.classList.remove('down'); };
  b.addEventListener('touchstart', on, { passive: false }); b.addEventListener('touchend', off, { passive: false }); b.addEventListener('touchcancel', off, { passive: false });
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
});
cv.addEventListener('pointerdown', () => { audioInit(); if (!document.getElementById('touch').classList.contains('on')) actPressed = true; });
document.getElementById('mute').addEventListener('click', () => { audioInit(); toggleMute(); });

/* ---------- audio (all original, tiny chiptune) ---------- */
let ac = null, muted = false, musicTimer = null, mi = 0;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); startMusic(); } catch (e) { ac = null; }
}
function toggleMute() { muted = !muted; document.getElementById('mute').textContent = '♪ music: ' + (muted ? 'off' : 'on') + ' (M)'; }
function tone(f, d, type, v, when) {
  if (!ac || muted) return;
  const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(v || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
}
const N = { C3: 130.8, E3: 164.8, F3: 174.6, G3: 196, A3: 220, C4: 261.6, D4: 293.7, E4: 329.6, F4: 349.2, G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3 };
const MEL = ['E4', 'G4', 'C5', 'G4', 'A4', 'C5', 'E5', 'C5', 'F4', 'A4', 'C5', 'A4', 'G4', 'B4', 'D5', 'B4'];
const BAS = ['C3', 'C3', 'A3', 'A3', 'F3', 'F3', 'G3', 'G3'];
function startMusic() {
  musicTimer = setInterval(() => {
    if (muted || !ac) return;
    tone(N[MEL[mi % 16]], 0.45, 'triangle', 0.035);
    if (mi % 2 === 0) tone(N[BAS[(mi / 2 | 0) % 8]], 0.7, 'sine', 0.05);
    mi++;
  }, 330);
}
const sfx = {
  blip() { tone(660, .05, 'square', .03); },
  good() { tone(660, .08, 'square', .05); tone(880, .1, 'square', .05, .07); },
  bad() { tone(160, .2, 'sawtooth', .06); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .07, i * .1)); },
  step() { tone(120, .03, 'square', .01); }
};

/* ---------- drawing helpers ---------- */
function txt(s, x, y, o) {
  o = o || {};
  ctx.font = (o.b === false ? '' : 'bold ') + (o.size || 14) + 'px "Courier New",monospace';
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'top';
  if (o.shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = 'bold ' + size + 'px "Courier New",monospace';
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function panel(x, y, w, h, fill, stroke) {
  ctx.fillStyle = fill || 'rgba(16,24,40,.93)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = stroke || '#f5d98a'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function heart(x, y, s, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s, y - s * .5, x - s * .4, y - s * 1.1, x, y - s * .4);
  ctx.bezierCurveTo(x + s * .4, y - s * 1.1, x + s, y - s * .5, x, y + s * .35); ctx.fill();
}
function star(x, y, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

/* ---------- people ---------- */
const SK = ['#f2cba5', '#e8b88f', '#d9a37a', '#c68b61', '#8d5a3b'];
function look(o) { return Object.assign({ skin: SK[0], hair: '#6b4423', outfit: '#4a6fa5', pants: '#2b2b3a', style: 'short', glasses: false, dress: false, tie: null, veil: false }, o); }
const JAKE = look({ skin: SK[0], hair: '#7a5230', outfit: '#2f4a6b', pants: '#33384a' });
const JAKE_TUX = look({ skin: SK[0], hair: '#7a5230', outfit: '#1c2433', pants: '#1c2433', tie: '#f5d98a' });
const JULIA = look({ skin: SK[1], hair: '#6b3f22', outfit: '#d98ba0', style: 'long', dress: true });
const JULIA_BRIDE = look({ skin: SK[1], hair: '#6b3f22', outfit: '#fbf7f0', style: 'long', dress: true, veil: true });
function person(x, y, p, dir, walk, sit) {
  const s = walk ? Math.sin(walk * 12) : 0;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y, 8, 3, 0, 0, 7); ctx.fill();
  const R = (a, b, w, h, c) => rect(x + a, y + b, w, h, c);
  if (!sit) {
    if (p.dress) { R(-7, -12, 14, 10, p.outfit); R(-8, -4, 16, 3, p.outfit); R(-3, -1, 2, 1, p.skin); R(1, -1, 2, 1, p.skin); }
    else { R(-4, -10, 3, 10 + (s > .3 ? -1 : 0), p.pants); R(1, -10, 3, 10 + (s < -.3 ? -1 : 0), p.pants); }
  }
  R(-5, -20, 10, 10, p.outfit);
  if (p.tie) R(-1, -19, 2, 6, p.tie);
  R(-7, -19, 2, 8, p.outfit); R(5, -19, 2, 8, p.outfit); R(-7, -11, 2, 2, p.skin); R(5, -11, 2, 2, p.skin);
  R(-5, -30, 10, 10, p.skin);
  if (dir === 3) { R(-6, -32, 12, 13, p.hair); if (p.style === 'long') R(-6, -20, 12, 8, p.hair); }
  else {
    R(-6, -32, 12, 5, p.hair);
    if (p.style === 'long') { R(-6, -30, 2, 14, p.hair); R(4, -30, 2, 14, p.hair); }
    else { R(-6, -30, 2, 3, p.hair); R(4, -30, 2, 3, p.hair); }
    if (p.style === 'bun') R(-2, -36, 5, 4, p.hair);
    const ey = -26;
    if (dir === 0) { R(-3, ey, 2, 2, '#222'); R(1, ey, 2, 2, '#222'); }
    else if (dir === 1) R(-4, ey, 2, 2, '#222'); else R(2, ey, 2, 2, '#222');
    if (p.glasses) { ctx.strokeStyle = '#222'; ctx.lineWidth = 1; if (dir === 0) { ctx.strokeRect(x - 4.5, y + ey - 1.5, 4, 4); ctx.strokeRect(x + .5, y + ey - 1.5, 4, 4); } }
    if (dir === 0) R(-1, -22, 2, 1, '#b3544e');
  }
  if (p.veil) { R(-7, -33, 14, 3, '#ffffff'); R(-7, -30, 2, 24, 'rgba(255,255,255,.75)'); R(5, -30, 2, 24, 'rgba(255,255,255,.75)'); }
}

/* ---------- particles ---------- */
const parts = [];
function burst(x, y, n, kind) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-130, 130), vy: rnd(-240, -40), life: rnd(.9, 1.8), t: 0, kind, c: ['#ff6b8b', '#ffd166', '#6bd5ff', '#9be37a', '#c79bff'][i % 5], r: rnd(2, 4.5) });
}
function partsUpdate(dt) {
  for (const p of parts) { p.t += dt; p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t > parts[i].life) parts.splice(i, 1);
}
function partsDraw() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    if (p.kind === 'heart') heart(p.x, p.y, p.r * 2.2, '#ff6b8b'); else rect(p.x, p.y, p.r, p.r, p.c);
  }
  ctx.globalAlpha = 1;
}

/* ---------- dialogue ---------- */
const dlg = { q: [], cur: null, shown: 0, done: null, lines: [] };
function say(lines, done) { dlg.q = lines.slice(); dlg.done = done || null; nextLine(); }
function nextLine() {
  const l = dlg.q.shift();
  if (!l) { dlg.cur = null; const d = dlg.done; dlg.done = null; if (d) d(); return; }
  dlg.cur = typeof l === 'string' ? { who: '', t: l } : { who: l[0], t: l[1] };
  dlg.shown = 0; dlg.lines = null;
}
function dlgUpdate(dt) {
  if (!dlg.cur) return false;
  dlg.shown += dt * 55;
  if (actPressed) {
    actPressed = false;
    if (dlg.shown < dlg.cur.t.length) dlg.shown = 1e9; else { sfx.blip(); nextLine(); }
  }
  return !!dlg.cur;
}
function dlgDraw() {
  if (!dlg.cur) return;
  const x = 16, y = H - 118, w = W - 32, h = 104;
  panel(x, y, w, h);
  let ty = y + 10;
  if (dlg.cur.who) { txt(dlg.cur.who, x + 14, ty, { color: '#f5d98a', size: 14 }); ty += 20; }
  if (!dlg.lines) dlg.lines = wrap(dlg.cur.t, w - 30, 14);
  let rem = Math.floor(dlg.shown);
  for (const ln of dlg.lines) {
    if (rem <= 0) break;
    txt(ln.slice(0, rem), x + 14, ty, { size: 14 }); rem -= ln.length + 1; ty += 18;
  }
  if (dlg.shown >= dlg.cur.t.length && Math.floor(performance.now() / 400) % 2) txt('▼', x + w - 28, y + h - 22, { color: '#f5d98a' });
}

/* ---------- scenes, fades, progress ---------- */
let scene = null, fade = { a: 0, dir: 0, cb: null };
function go(s) { scene = s; dlg.cur = null; dlg.q = []; dlg.done = null; parts.length = 0; if (s.enter) s.enter(); }
function fadeTo(cb) { if (fade.dir !== 0) return; fade.dir = 1; fade.cb = cb; }
let progress = 0;
try { progress = parseInt(localStorage.getItem('jj_progress') || '0', 10) || 0; } catch (e) { }
function saveProgress(n) { progress = Math.max(progress, n); try { localStorage.setItem('jj_progress', String(progress)); } catch (e) { } }

function Card(title, sub, body, next, opt) {
  opt = opt || {}; let t = 0;
  const stars = Array.from({ length: 50 }, () => ({ x: rnd(0, W), y: rnd(0, H), s: rnd(.5, 2) }));
  return {
    update(dt) { t += dt; if (actPressed && t > .35) { sfx.blip(); fadeTo(next); } },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, opt.c1 || '#1d2b4a'); g.addColorStop(1, opt.c2 || '#4b3b6b');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (const s of stars) { ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * s.s + s.x)); rect(s.x, s.y, 2, 2, '#fff'); } ctx.globalAlpha = 1;
      txt(title, W / 2, 70, { align: 'center', size: 26, color: '#f5d98a' });
      if (sub) txt(sub, W / 2, 108, { align: 'center', size: 15, color: '#cfe3ff' });
      let y = 150;
      for (const para of body) { for (const ln of wrap(para, 500, 15)) { txt(ln, W / 2, y, { align: 'center', size: 15 }); y += 21; } y += 10; }
      if (Math.floor(t * 2) % 2) txt('Press SPACE / A to continue', W / 2, H - 40, { align: 'center', size: 13, color: '#f5d98a' });
    }
  };
}

/* ---------- generic top-down walking scene ---------- */
function makeWalk(cfg) {
  const P = { x: cfg.start[0], y: cfg.start[1], dir: 3, walk: 0 };
  const trail = []; let msg = '', msgT = 0;
  const sc = {
    P, cfg, t: 0, flags: {}, frozen: false,
    toast(m, d) { msg = m; msgT = d || 3; },
    update(dt, talking) {
      sc.t += dt; msgT = Math.max(0, msgT - dt);
      partsUpdate(dt);
      if (talking || sc.frozen) return;
      const dx = (inR() ? 1 : 0) - (inL() ? 1 : 0), dy = (inD() ? 1 : 0) - (inU() ? 1 : 0);
      if (dx || dy) {
        const m = Math.hypot(dx, dy), sp = 112 * dt / m;
        const mv = (ax, ay) => { const nx = clamp(P.x + ax, 10, W - 10), ny = clamp(P.y + ay, cfg.top || 60, H - 6); if (!blocked(nx, ny)) { P.x = nx; P.y = ny; } };
        mv(dx * sp, 0); mv(0, dy * sp);
        P.walk += dt; P.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0);
        trail.push({ x: P.x, y: P.y }); if (trail.length > 400) trail.shift();
      } else P.walk = 0;
      function blocked(x, y) {
        for (const r of cfg.solids || []) if (x + 5 > r.x && x - 5 < r.x + r.w && y > r.y && y - 6 < r.y + r.h) return true;
        for (const n of cfg.npcs || []) if (n.solid !== false && Math.hypot(x - n.x, (y - n.y) * 1.4) < 12) return true;
        return cfg.blocked ? cfg.blocked(x, y, sc) : false;
      }
      if (actPressed) {
        let best = null, bd = 38;
        for (const n of cfg.npcs || []) { const d = Math.hypot(P.x - n.x, (P.y - n.y) * 1.2); if (d < bd && n.talk !== false) { bd = d; best = n; } }
        if (best) {
          const ax = P.x - best.x, ay = P.y - best.y;
          best.dir = Math.abs(ax) > Math.abs(ay) ? (ax < 0 ? 2 : 1) : (ay < 0 ? 0 : 3);
          sfx.blip(); best.talked = true;
          if (best.onTalk) best.onTalk(sc, best); else if (best.lines) say(best.lines, () => { if (best.onDone) best.onDone(sc, best); });
        }
      }
      for (const it of cfg.items || []) if (!it.got && Math.hypot(P.x - it.x, P.y - it.y) < 16) { it.got = true; sfx.good(); burst(it.x, it.y, 8, 'c'); if (cfg.onItem) cfg.onItem(it, sc); }
      if (cfg.update) cfg.update(dt, sc);
    },
    draw() {
      cfg.bg(sc);
      for (const it of cfg.items || []) if (!it.got) { const b = Math.sin(sc.t * 4 + it.x) * 2; if (cfg.drawItem) cfg.drawItem(it, b, sc); }
      const ents = [];
      for (const n of cfg.npcs || []) ents.push({ y: n.y, f: () => { person(n.x, n.y, n.look, n.dir || 0, 0); if (n.talked && cfg.checks) txt('✓', n.x - 4, n.y - 52, { color: '#9be37a', size: 13 }); } });
      if (cfg.follower) { const tr = trail.length > 30 ? trail[trail.length - 30] : { x: P.x, y: P.y + 14 }; ents.push({ y: tr.y, f: () => person(tr.x, tr.y, cfg.follower, 0, P.walk, false) }); }
      ents.push({ y: P.y, f: () => person(P.x, P.y, cfg.me || JAKE, P.dir, P.walk) });
      ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
      if (cfg.fg) cfg.fg(sc);
      for (const n of cfg.npcs || []) {
        if (n.talk === false) continue;
        const d = Math.hypot(P.x - n.x, (P.y - n.y) * 1.2);
        if (d < 40 && !dlg.cur) {
          const label = n.name || ''; ctx.font = 'bold 12px "Courier New",monospace';
          const w = ctx.measureText(label).width + 16;
          panel(n.x - w / 2, n.y - 74, w, 22, 'rgba(16,24,40,.9)'); txt(label, n.x, n.y - 71, { align: 'center', size: 12 });
          txt('SPACE', n.x, n.y - 50, { align: 'center', size: 10, color: '#f5d98a' });
        }
      }
      partsDraw();
      if (cfg.hud) cfg.hud(sc);
      if (msgT > 0) { const ls = wrap(msg, 440, 14); const h = ls.length * 18 + 14; panel(W / 2 - 230, 38, 460, h); ls.forEach((l, i) => txt(l, W / 2, 45 + i * 18, { align: 'center', size: 14 })); }
    }
  };
  return sc;
}
function hudBar(label, a, b) {
  panel(8, 6, 250, 26, 'rgba(16,24,40,.85)'); txt(label + ' ' + a + '/' + b, 16, 12, { size: 13 });
}

/* ---------- CATCH ENGINE (texts, ice cream, canoe) ---------- */
function makeCatch(cfg) {
  const fresh = () => ({ x: W / 2, y: cfg.py || H - 52, items: [], score: 0, lives: cfg.lives || 5, t: 0, spawn: 1, feed: [], stack: [], flash: 0, state: 'play' });
  let S = fresh();
  return {
    update(dt, talking) {
      partsUpdate(dt);
      if (talking || S.state !== 'play') return;
      S.t += dt; S.flash = Math.max(0, S.flash - dt);
      S.x = clamp(S.x + ((inR() ? 1 : 0) - (inL() ? 1 : 0)) * cfg.speed * dt, cfg.minX || 30, cfg.maxX || W - 30);
      S.spawn -= dt;
      if (S.spawn <= 0) {
        S.spawn = cfg.rate * rnd(.75, 1.25);
        const bad = Math.random() < cfg.badChance;
        const pool = bad ? cfg.bad : cfg.good;
        S.items.push({ x: rnd(cfg.minX || 30, cfg.maxX || W - 30), y: -20, vy: cfg.fall * rnd(.85, 1.2), kind: pool[(Math.random() * pool.length) | 0], bad, r: rnd(0, 6), n: Math.random() });
      }

      if (S.score >= cfg.goal) { S.state = 'won'; sfx.win(); burst(S.x, S.y - 30, 40, 'heart'); say(cfg.winLines, () => cfg.done()); }
      else if (S.lives <= 0) { S.state = 'lost'; say([['', cfg.loseText || 'Oh no! Take a breath and try that again.']], () => { S = fresh(); }); }
    },
    draw() {
      cfg.bg(S.t, S);

      cfg.drawPlayer(S.x, S.y, S.t, S);
      if (cfg.feed) cfg.feed(S);
      panel(8, 6, 300, 26); txt(cfg.label + ' ' + Math.min(S.score, cfg.goal) + '/' + cfg.goal, 16, 12, { size: 13 });
      for (let i = 0; i < (cfg.lives || 5); i++) heart(W - 24 - i * 22, 14, 7, i < S.lives ? '#ff6b8b' : '#4a3a4a');
      if (S.flash > 0) { ctx.fillStyle = 'rgba(255,60,60,' + (S.flash) + ')'; ctx.fillRect(0, 0, W, H); }
      partsDraw();
    }
  };
}

      if (next < 5) cps.forEach((c, i) => {
        if (Math.hypot(P.x - c.x, P.y - c.y) < 18) {
          if (i === next) { next++; sfx.good(); burst(c.x, c.y, 10, 'heart'); if (next < 5) sc.toast('Counterclockwise! Checkpoint ' + next + '/5.', 2.5); else sc.toast('Jake asks to go down a different part of the trail. Follow the glowing pier!', 5); }
          else if (i > next && cool <= 0 && !(cps[i].done)) { cool = 4; sfx.bad(); sc.toast('Julia: "Wrong way! We ALWAYS walk counterclockwise!"', 3.5); }
        }
      });
      if (next >= 5 && !proposed && Math.hypot(P.x - tip.x, P.y - tip.y) < 20) {
        proposed = true; sc.frozen = true; P.dir = 1;
        say([
          ['Julia', 'Jake, the path ends right at the water. This is so beautiful.'],

          ['Jake', 'Julia Buchholz... will you marry me?'],
          ['Julia', 'YES!'],
          ['', 'After about four years of friendship and dating, Jake proposed at Blue Heron Lake in West Des Moines.']
        ], () => { for (let i = 0; i < 5; i++) setTimeout(() => burst(tip.x, tip.y - 20, 30, 'heart'), i * 250); sfx.win(); setTimeout(done, 2200); });
      }
    },
    hud(sc) { panel(8, 6, 250, 26); txt(next < 5 ? 'Loop checkpoints ' + next + '/5' : 'Find the pier!', 16, 12, { size: 13 }); }
  };
  cfg.npcs = [];
  const sc = makeWalk(cfg);
  sc.enter = () => say([['Julia', 'Want to walk around Blue Heron Lake? It is a three-mile loop. You know the rule.'], ['Jake', 'Counterclockwise. Always.'], ['', 'Walk the loop COUNTERCLOCKWISE. Start toward the right side, then up and around.']]);
  return sc;
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (scene) {
    const talking = dlgUpdate(dt);
    if (fade.dir === 0) scene.update(dt, talking); else scene.update(0, true);
    scene.draw(); dlgDraw();
  }
  if (fade.dir !== 0) {
    fade.a += fade.dir * dt * 3.2;
    if (fade.dir === 1 && fade.a >= 1) { fade.a = 1; fade.dir = -1; const cb = fade.cb; fade.cb = null; if (cb) cb(); }
    else if (fade.dir === -1 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
    ctx.fillStyle = 'rgba(0,0,0,' + clamp(fade.a, 0, 1) + ')'; ctx.fillRect(0, 0, W, H);
  }
  actPressed = false; navPress = 0;
  requestAnimationFrame(frame);
}
window.JJ = { go, runChapter, CH, Title, Select, Credits, get scene() { return scene; }, get progress() { return progress; }, say };
go(Title());
requestAnimationFrame(frame);
